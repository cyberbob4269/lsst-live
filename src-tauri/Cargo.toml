[package]
name = "vera-terminal"
version = "0.1.0"
description = "Vera Terminal — lightweight AI IDE/terminal"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vera_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.9"
# NB: keyring 3.x has NO default platform backend — without an explicit
# feature it falls back to a non-persistent in-memory store (set succeeds,
# get finds nothing, nothing reaches Windows Credential Manager).
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
# HTTP proxy for provider API calls (http_proxy.rs). native-tls ALONE on
# purpose: on Windows that is schannel, which trusts the Windows root store —
# so TLS-intercepting AV (e.g. Avast Web Shield, which re-signs with its own
# root) cannot break provider calls the way reqwest's bundled webpki roots
# (via tauri-plugin-http) did. No rustls feature is enabled at all.
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
